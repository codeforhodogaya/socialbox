
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>五書×視座ネットワーク図（D3.js）</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    svg { width: 100vw; height: 100vh; display: block; }
    text { font-size: 10px; }
  </style>
</head>
<body>
  <svg></svg>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const nodes = [
      { id: "聖書" }, { id: "御書" }, { id: "シェイクスピア" }, { id: "孫子" }, { id: "カント" },
      { id: "OODA" }, { id: "IKIGAI" }, { id: "BMC" }, { id: "TOC" }, { id: "U理論" },
      { id: "SCQA" }, { id: "PESTLE" }, { id: "文化資本" }, { id: "ダイアローグ" }, { id: "リベラルアーツ" }, { id: "Well-being" }
    ];

    const links = [
      { source: "聖書", target: "Well-being" },
      { source: "御書", target: "ダイアローグ" },
      { source: "シェイクスピア", target: "リベラルアーツ" },
      { source: "孫子", target: "TOC" },
      { source: "カント", target: "文化資本" },
      { source: "カント", target: "リベラルアーツ" }
    ];

    const svg = d3.select("svg");
    const width = window.innerWidth;
    const height = window.innerHeight;

    const simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(80))
      .force("charge", d3.forceManyBody().strength(-30))  // 調整済み
      .force("center", d3.forceCenter(width / 2, height / 2));

    const link = svg.append("g")
      .attr("stroke", "#999")
      .attr("stroke-opacity", 0.6)
      .selectAll("line")
      .data(links)
      .enter().append("line")
      .attr("stroke-width", 2);

    const node = svg.append("g")
      .attr("stroke", "#fff")
      .attr("stroke-width", 1.5)
      .selectAll("circle")
      .data(nodes)
      .enter().append("circle")
      .attr("r", 10)
      .attr("fill", "#69b3a2")
      .call(drag(simulation));

    const label = svg.append("g")
      .selectAll("text")
      .data(nodes)
      .enter().append("text")
      .text(d => d.id)
      .attr("x", 12)
      .attr("y", "0.31em");

    simulation.on("tick", () => {
      link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

      node
          .attr("cx", d => d.x)
          .attr("cy", d => d.y);

      label
          .attr("x", d => d.x + 12)
          .attr("y", d => d.y);
    });

    function drag(simulation) {
      return d3.drag()
        .on("start", (event, d) => {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x;
          d.fy = d.y;
        })
        .on("drag", (event, d) => {
          d.fx = event.x;
          d.fy = event.y;
        })
        .on("end", (event, d) => {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null;
          d.fy = null;
        });
    }
  </script>
</body>
</html>
