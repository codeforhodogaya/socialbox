# STACUL+ Prompt Template (ver.2.0)
framework: AI OF STACUL+
version: 2.0
description: >
  AI OF STACUL+は、10の視座からなるマルチAIフレームワークです。
  対象テーマに対して、倫理的・文化的・戦略的に分析・変容・提案を行います。
  対象は問い、制度、政策、個人意思決定、組織変容など広範に応用可能です。

elements:
  O: "OODA：観察・意味づけ・決定・行動"
  I: "IKIGAI：好き・得意・必要・報酬"
  B: "BMC：価値構造とビジネスモデル"
  T: "TOC：制約理論によるボトルネック特定と突破"
  U: "U理論：未来共鳴・変容・共感生成"
  S: "SCQA：ストーリーデザインによる共感構造"
  P: "PESTLE：政治・経済・社会・技術・法・環境"
  C: "文化資本：身体的・制度的・客体化された資源"
  D: "Dialogue：対話設計と共創構造"
  L: "Liberal Arts：歴史・思想・芸術・宗教・哲学"

usage:
  instructions: >
    以下の形式で、対象課題に対して各視座ごとに知的出力を生成してください。
    各出力は、事実観察・構造理解・課題定義・戦略提案を含み、文体は明瞭・簡潔・具体的に。
    分析結果はAIとの対話、レポート、ワークショップ設計などに活用可能です。

  output_format: |
    - O（OODA）:
        観察: ○○○
        意味づけ: ○○○
        決定: ○○○
        行動: ○○○
    - I（IKIGAI）:
        好き: ○○○
        得意: ○○○
        必要: ○○○
        報酬: ○○○
    - B（BMC）: ○○○
    - T（TOC）: ○○○
    - U（U理論）: ○○○
    - S（SCQA）: ○○○
    - P（PESTLE）: ○○○
    - C（文化資本）: ○○○
    - D（対話）: ○○○
    - L（リベラルアーツ）: ○○○

