
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>STACUL+｜LOD構文 可視化ギャラリー</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f6f9fc;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 1.5rem;
      text-align: center;
    }
    .tabs {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }
    .tab-button {
      padding: 1rem;
      margin: 0 0.5rem;
      cursor: pointer;
      background-color: #ecf0f1;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
    }
    .tab-button.active {
      background-color: #3498db;
      color: white;
    }
    .tab-content {
      display: none;
      padding: 2rem;
      max-width: 960px;
      margin: auto;
    }
    .tab-content.active {
      display: block;
    }
    .link-card {
      background-color: white;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
    }
    a {
      text-decoration: none;
      color: #2980b9;
      font-weight: bold;
    }
    .note {
      font-size: 0.9rem;
      color: #555;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>STACUL+｜LOD構文 可視化ギャラリー</h1>
  </header>

  <div class="tabs">
    <button class="tab-button active" onclick="showTab('tab1')">🔍 ビジュアライズ</button>
    <button class="tab-button" onclick="showTab('tab2')">🗂 構文データ</button>
    <button class="tab-button" onclick="showTab('tab3')">💡 説明</button>
  </div>

  <div id="tab1" class="tab-content active">
    <div class="link-card">
      <a href="lod_visualization.html" target="_blank">📡 vis-network構文LODビジュアライズ</a>
      <div class="note">構文LODを動的ネットワークで表示（JSONデータ連携）</div>
    </div>
    <div class="link-card">
      <a href="stacul_mermaid_structure.html" target="_blank">🧭 Mermaid図：視座間構造</a>
      <div class="note">各フレームワーク間の相互関係を図示</div>
    </div>
    <div class="link-card">
      <a href="stacul_syntax_structure.html" target="_blank">🔄 vis-network版：構文全体構造</a>
      <div class="note">フレームワーク全体のLOD相関を動的表示</div>
    </div>
  </div>

  <div id="tab2" class="tab-content">
    <div class="link-card">
      <a href="stacul_data.json" target="_blank">📁 stacul_data.json</a>
      <div class="note">構文LODに用いられる主要データファイル（JSON形式）</div>
    </div>
  </div>

  <div id="tab3" class="tab-content">
    <div class="link-card">
      <p>本ページでは、AI OF STACUL+のLOD構文および視座間の関係性を可視化しています。GitHub Pages上で公開され、LODチャレンジ等の外部連携にも対応可能です。</p>
    </div>
  </div>

  <script>
    function showTab(tabId) {
      const tabs = document.querySelectorAll('.tab-content');
      const buttons = document.querySelectorAll('.tab-button');
      tabs.forEach(tab => tab.classList.remove('active'));
      buttons.forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
