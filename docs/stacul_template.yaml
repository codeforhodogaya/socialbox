# STACUL+ YAML構文テンプレート（コメント付き）
# 各視座に沿って記述してください。不要な視座は削除可。

O: # OODA：観察・意味づけ・決定・行動（例：問題の現状分析と意思決定）
I: # IKIGAI：好き・得意・必要・報酬（例：内発的動機の整理）
B: # BMC：価値構造とビジネスモデル（例：9要素の構造分析）
T: # TOC：制約理論（例：ボトルネックの特定と集中突破）
U: # U理論：未来への共鳴と変容（例：変容プロセスの記述）
S: # SCQA：状況・複雑性・問い・答え（例：物語構造による提案設計）
P: # PESTLE：外部環境分析（例：政治・経済・技術などマクロ視点）
C: # Culture：文化資本（例：身体的・制度的・客体化の3層分析）
D: # Dialogue：対話設計と関係性構築（例：関係者マッピングや共創設計）
L: # Liberal Arts：歴史・思想・芸術からの示唆
W: # Well-being：4因子での状態評価（やってみよう・ありがとう等）
