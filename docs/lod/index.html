
<!DOCTYPE html>
<html lang="ja">
<head>

  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 2em;
    }
    h1 {
      color: #222;
      border-bottom: 2px solid #444;
      padding-bottom: 0.3em;
    }
    .tabs {
      display: flex;
      margin-bottom: 1em;
    }
    .tab-button {
      flex: 1;
      padding: 1em;
      background-color: #ddd;
      border: 1px solid #bbb;
      cursor: pointer;
      text-align: center;
    }
    .tab-button.active {
      background-color: #fff;
      border-bottom: none;
      font-weight: bold;
    }
    .tab-content {
      display: none;
      background: #fff;
      border: 1px solid #bbb;
      border-top: none;
      padding: 1.5em;
      border-radius: 0 0 8px 8px;
    }
    .tab-content.active {
      display: block;
    }
    .link-item {
      margin-bottom: 1em;
    }
    .link-item a {
      font-weight: bold;
      color: #0066cc;
      text-decoration: none;
    }
    .link-item a:hover {
      text-decoration: underline;
    }
    .note {
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>STACUL+｜LOD構文 可視化ギャラリー</h1>
  <div class="tabs">
    <div class="tab-button active" onclick="showTab(0)">🔍 ビジュアライズ</div>
    <div class="tab-button" onclick="showTab(1)">🗂 構文データ</div>
    <div class="tab-button" onclick="showTab(2)">💡 説明</div>
  </div>

    </div>
    <div class="link-item">

  </div>
  <script>
    function showTab(index) {
      const buttons = document.querySelectorAll('.tab-button');
      const contents = document.querySelectorAll('.tab-content');
      buttons.forEach((btn, i) => btn.classList.toggle('active', i === index));
      contents.forEach((content, i) => content.classList.toggle('active', i === index));
    }
  </script>
