
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>STACUL+ 構文LODビジュアライズ</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style type="text/css">
    #mynetwork {
      width: 100%;
      height: 800px;
      border: 1px solid lightgray;
    }
  </style>
</head>
<body>
  <h2>📡 STACUL+｜構文LODビジュアライズ</h2>
  <div id="mynetwork"></div>

  <script type="text/javascript">
    // GitHub Pages上の絶対パスで読み込み
    fetch('https://codeforhodogaya.github.io/socialbox/stacul_data.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('ネットワーク応答エラー');
        }
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('mynetwork');
        const options = {
          nodes: {
            shape: 'dot',
            size: 16,
            font: { size: 14, color: '#333' },
            borderWidth: 2
          },
          edges: {
            width: 2,
            color: { inherit: 'from' },
            smooth: { type: 'dynamic' }
          },
          physics: {
            enabled: true,
            solver: 'forceAtlas2Based',
            forceAtlas2Based: {
              gravitationalConstant: -50,
              centralGravity: 0.01,
              springLength: 100,
              springConstant: 0.08
            },
            timestep: 0.35,
            stabilization: { iterations: 150 }
          },
          interaction: {
            tooltipDelay: 100,
            hideEdgesOnDrag: false
          }
        };
        new vis.Network(container, data, options);
      })
      .catch(error => {
        console.error('ビジュアライズエラー:', error);
        document.getElementById('mynetwork').innerText = '可視化の読み込みに失敗しました。';
      });
  </script>
</body>
</html>
