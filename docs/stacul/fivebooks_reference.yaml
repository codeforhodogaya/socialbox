fivebooks:
  - id: bible
    name: 聖書（旧・新約）
    keywords: ["倫理", "召命", "罪と贖い", "光と闇", "自由意志"]
    stacul_views: ["W", "L", "O"]
    usage: "意味づけや道徳判断の軸。『混沌からの秩序』『選ばれし者』などの象徴構文に活用。"

  - id: gosho
    name: 民衆的実践語録（御書）
    keywords: ["共苦", "慈悲", "因果", "自己変革", "共戦"]
    stacul_views: ["W", "D", "C"]
    usage: "実践的人間主義。庶民の視点での変革論や、他者と苦悩を分かち合う構造に活用。"

  - id: shakespeare
    name: シェイクスピア全集
    keywords: ["悲劇", "誤解", "皮肉", "運命", "選択"]
    stacul_views: ["D", "L", "S"]
    usage: "心理的葛藤・対話・劇的構成のモデリングに最適。『ハムレット型意思決定』等に引用可。"

  - id: sunzi
    name: 孫子の兵法
    keywords: ["勢", "非対立", "奇正", "知彼知己", "無駄な戦を避ける"]
    stacul_views: ["O", "T", "B"]
    usage: "環境分析やボトルネック戦略構築に。『戦わずして勝つ』を軸とした行動設計に適用。"

  - id: kant
    name: カント（純粋理性批判など）
    keywords: ["自律", "義務", "理性", "目的としての人間", "自由"]
    stacul_views: ["C", "W", "L"]
    usage: "行動の根拠に倫理的・合理的説明が求められる場合、道徳律の土台として使用可能。"
