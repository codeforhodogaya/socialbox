
<!DOCTYPE html>
<html>
<head>
  <title>STACUL+ 構文LODビジュアライズ</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
  <link href="https://unpkg.com/vis-network@9.1.2/styles/vis-network.min.css" rel="stylesheet" type="text/css" />
  <style>
    #network {
      width: 100%;
      height: 800px;
      border: 1px solid lightgray;
    }
  </style>
</head>
<body>
  <h2>STACUL+ 構文LODビジュアライズ</h2>
  <div id="network"></div>
  <script>
    fetch('https://codeforhodogaya.github.io/socialbox/lod/stacul_data.json')
      .then(response => response.json())
      .then(data => {
        const nodes = new vis.DataSet(data.nodes);
        const edges = new vis.DataSet(data.edges);

        const container = document.getElementById('network');
        const options = {
          nodes: {
            shape: 'dot',
            size: 16,
            font: {
              size: 14,
              color: '#000'
            },
            borderWidth: 2
          },
          edges: {
            width: 2,
            color: { inherit: 'from' },
            smooth: {
              type: 'continuous'
            }
          },
          interaction: {
            tooltipDelay: 200,
            hideEdgesOnDrag: false
          },
          physics: {
            stabilization: true
          }
        };

        new vis.Network(container, { nodes, edges }, options);
      })
      .catch(error => {
        document.getElementById('network').innerText = 'データの読み込みに失敗しました。';
        console.error('Error loading the JSON data:', error);
      });
  </script>
</body>
</html>
